======================================================================
[1. ARCHITECTURE RULES - 단일 파일 원칙]
======================================================================
• 무설치 단일 파일 완결 (Zero External File):
  - 외부 별도 .js 또는 .css 파일을 일절 분리하지 마세요.
  - 단 하나의 index.html 파일 내에 HTML, Tailwind CDN, &lt;script&gt;를 모두 통합하세요.

• 제로 빌드 즉시 실행 (Zero Build):
  - Node.js 설치나 빌드 과정 없이 크롬/엣지 브라우저 더블클릭만으로 0.5초 만에 즉시 구동되어야 합니다.

• 코드 완결성 보장 (No Truncation):
  - "// ...기존 코드 유지...", "// ...이하 로직 동일..."과 같은 축약 표기를 절대 금지합니다.
  - 처음 &lt;!DOCTYPE html&gt;부터 끝 &lt;/html&gt;까지 복사 즉시 실행 가능한 완본 코드를 출력하세요.

• 데이터 보안 준수 (Client-Side Only):
  - 로컬 브라우저 FileReader API를 활용하여 사내 데이터가 외부 서버로 절대 전송되지 않도록 하세요.


======================================================================
[2. CORE UI & FUNCTION REQUIREMENTS]
======================================================================
• 디자인 & 톤앤매너:
  - Tailwind CSS 기반 모던 다크모드/슬레이트(Slate) 테마 및 직관적 시각 계층 구조
  - 둥근 모서리(rounded-xl), 명확한 여백, 카드 그림자 효과 적용

• 상단 헤더 영역:
  - 시스템 타이틀 및 상태 뱃지
  - CSV/데이터 드래그 앤 드롭 업로드 및 파일 선택기

• 핵심 지표 카드 (KPI Dashboard):
  - 상단 4종 핵심 KPI 카드 (총 수량, 처리율, 지연 건수, 리스크 지수)
  - 증감률 뱃지 및 아이콘 강조

• 스마트 데이터 테이블 & 인터랙션:
  - 실시간 검색창 및 상태별 필터 탭 (전체 / 정상 / 지연 / 긴급)
  - 브라우저 기본 경고창(alert, confirm) 사용 절대 금지 ➔ 커스텀 플로팅 토스트/모달 적용


======================================================================
[3. DONE CRITERIA & STOP CONDITIONS (2026 최신 검증 규칙)]
======================================================================
• 완료 기준 (Done Criteria):
  - [ ] 빈 파일이나 오류 형식의 CSV가 입력되어도 앱이 멈추지 않고 안내 문구 표시
  - [ ] 계산식에서 분모가 0일 때 NaN이나 Infinity 대신 0% 또는 "-"로 예외 처리

• 질문 및 정지 조건 (Stop Condition):
  - 필수 데이터 컬럼이나 업무 기준이 모호하여 결과가 크게 왜곡될 위험이 있다면,
    코드를 임의로 지어내지 말고 필요한 질문 목록을 먼저 번호 매겨 제시하세요.

    let currentSlide = 0;

    function renderSlide(index) {
      if (index < 0 || index >= slidesData.length) return;
      currentSlide = index;
      const slide = slidesData[currentSlide];

      // Update Top Nav
      document.getElementById('slideIndicator').innerText = `${slide.id} / ${slidesData.length}`;
      document.getElementById('progressBar').style.width = `${((slide.id) / slidesData.length) * 100}%`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').disabled = (currentSlide === slidesData.length - 1);

      // Render Slide Frame
      const contentEl = document.getElementById('slideContent');
      contentEl.innerHTML = `
        <!-- Slide Header -->
        <div class="mb-5">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${slide.badgeColor}">
              ${slide.tag}
            </span>
            <span class="text-xs text-slate-500 font-mono">SLIDE ${slide.id.toString().padStart(2, '0')}</span>
          </div>
          <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight leading-snug">
            ${slide.title}
          </h2>
          <p class="text-sm text-slate-400 mt-1">
            ${slide.subtitle}
          </p>
        </div>

        <!-- Slide Dynamic Body -->
        <div class="flex-1 py-1">
          ${slide.render()}
        </div>

        <!-- Slide Footer Meta -->
        <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
          <div class="flex items-center gap-3">
            <span>바이브코딩 프롬프트 마스터 가이드</span>
            <span class="hidden sm:inline">•</span>
            <span class="hidden sm:inline">단일 파일 HTML 생산성 프로토콜</span>
          </div>
          <div>
            키보드 <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">←</kbd> <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">→</kbd> 방향키로 이동
          </div>
        </div>
      `;

      // Update overview grid highlighting
      renderOverviewGrid();
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        renderSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        renderSlide(currentSlide - 1);
      }
    }

    function goToSlide(slideId) {
      const idx = slidesData.findIndex(s => s.id === slideId);
      if (idx !== -1) {
        renderSlide(idx);
        closeOverview();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'Escape') {
        closeOverview();
      }
    });

    function toggleOverview() {
      const modal = document.getElementById('overviewModal');
      modal.classList.toggle('hidden');
    }

    function closeOverview() {
      document.getElementById('overviewModal').classList.add('hidden');
    }

    function renderOverviewGrid() {
      const grid = document.getElementById('overviewGrid');
      grid.innerHTML = slidesData.map(s => `
        <div onclick="goToSlide(${s.id})" class="cursor-pointer p-4 rounded-xl border transition-all ${s.id === currentSlide + 1 ? 'bg-indigo-950/60 border-indigo-500 ring-2 ring-indigo-500/30' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'}">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">#${s.id}</span>
            <span class="text-[10px] text-slate-500">${s.tag}</span>
          </div>
          <h4 class="text-xs font-bold text-white line-clamp-2">${s.title}</h4>
        </div>
      `).join('');
    }

    function copyToClipboard(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;

      const text = el.innerText || el.textContent;

      // ExecCommand fallback for iframe reliability
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast("클립보드에 프롬프트가 복사되었습니다!");
        } else {
          showToast("복사에 실패했습니다. 직접 복사해주세요.");
        }
      } catch (err) {
        showToast("복사 중 오류가 발생했습니다.");
      }
      document.body.removeChild(textArea);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toastMsg');
      msg.innerText = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }


    function renderPrintSlides() {
      const root = document.getElementById('printSlides');
      if (root.childElementCount) return;
      root.innerHTML = slidesData.map(slide => `
        <section class="print-page" aria-label="슬라이드 ${slide.id}">
          <p>프롬프트 작성법 · ${slide.id} / ${slidesData.length} · ${slide.tag}</p>
          <h2>${slide.title}</h2>
          <p class="print-subtitle">${slide.subtitle}</p>
          <div>${slide.render()}</div>
        </section>
      `).join('');
    }
    window.addEventListener('beforeprint', renderPrintSlides);
    window.addEventListener('load', async () => {
      if (new URLSearchParams(window.location.search).get('print') !== '1') return;
      document.body.classList.add('print-mode');
      renderPrintSlides();
      if (document.fonts) await document.fonts.ready;
      requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
    });

    // Initialize presentation on load
    window.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
      renderOverviewGrid();
    });
  </script>
